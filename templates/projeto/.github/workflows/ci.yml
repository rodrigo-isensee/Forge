# CI do projeto (modelo do Forge; skills/ci-cd/SKILL.md, "CI de projeto privado: minutos"). Neutro de stack (ADR 0001):
# o comando vem do pronto da stack (stacks/<stack>/pronto.md); a toolchain e o cache da seção "CI" dela entram no passo marcado.
# R-CUSTO: em projeto privado os minutos do Actions são a franquia gratuita. Por isso a suíte pesada roda só em pull request e
# no push das branches do fluxo (develop, homolog, main), nunca no push de branch de trabalho (o PR já a roda), e não roda
# em mudança só de documento (paths-ignore; o ci-docs.yml traz o job leve de mesmo nome "ci"). Push e PR da mesma branch
# dividem o grupo de concurrency, e a rodada obsoleta é cancelada.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: ["**/*.md", "docs/**"]
  push:
    branches: [develop, homolog, main]
    paths-ignore: ["**/*.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  suite:
    name: suíte
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Toolchain e cache da stack: copie da seção "CI" de stacks/<stack>/pronto.md (ações fixadas por SHA).
      - name: Pronto
        run: |
          {{COMANDO_PRONTO}}

  # Agregador de nome fixo: é este o check a exigir na proteção da branch (o dono configura, R-CONFORMIDADE).
  ci:
    name: ci
    if: always()
    needs: [suite]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Suíte verde
        env:
          RESULTADO: ${{ needs.suite.result }}
        run: test "$RESULTADO" = "success"
