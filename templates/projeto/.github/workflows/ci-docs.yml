# Par do ci.yml para a mudança só de documento: o ci.yml não roda nela (paths-ignore), e o check exigido "ci" ficaria
# pendente para sempre. Este job leve tem o MESMO nome "ci" e passa sem gastar a suíte. Mesma lista de caminhos do ci.yml.
name: CI (documento)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["**/*.md", "docs/**"]
  push:
    branches: [develop, homolog, main]
    paths: ["**/*.md", "docs/**"]

permissions: {}

concurrency:
  group: ci-docs-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Só documento
        run: echo "mudança só de documento; a suíte roda quando o código muda"
