name: Catraca

# Catraca anti-piora (ADR 0008, seção 3). Workflow à parte para reagir ao rótulo `afrouxa-regra` e à edição do corpo
# do PR sem rodar a bateria pesada do ci.yml. Só o evento `pull_request` (nunca o de contexto da base), só leitura; o corpo do
# PR entra apenas por `env:`.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

concurrency:
  group: catraca-${{ github.ref }}
  cancel-in-progress: true

# F1-ESPERA-NAO-E-VERMELHO (v0481 E47.1): a conferência (regras e texto do PR) roda num job e o check exigido `catraca` é o
# agregador dela. O rc 3 do script é só espera (o título declara `[afrouxa-regra` e falta o rótulo do dono): a conferência sai
# verde com a saída `espera`, e o agregador vira "catraca (espera rótulo)", deixando `catraca` pendente (amarelo), ainda barrando
# a junção. Sem a saída, o nome é `catraca` e só passa com a conferência em success. Com `catraca` verde já no head (o rótulo
# saiu depois), vermelho: o nome trocado deixaria o verde velho valer. Repositório público: o segundo job não custa dinheiro.
jobs:
  conferencia:
    name: catraca (conferência)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    outputs:
      espera: ${{ steps.regras.outputs.espera }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Regras que somem ou afrouxam, testes que somem, custo
        # Roda o script da base (a introdução da catraca usa o do PR); a base é o primeiro pai do merge commit.
        id: regras
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTOR: ${{ github.event.pull_request.user.login }}
          PR_TITULO: ${{ github.event.pull_request.title }}
        run: |
          BASE=$(git rev-parse HEAD^1)
          script=tests/catraca.py
          if git cat-file -e "$BASE:tests/catraca.py" 2>/dev/null; then
            git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
            script="$RUNNER_TEMP/base/tests/catraca.py"
          fi
          echo "CATRACA_DA_BASE=$script" >> "$GITHUB_ENV"
          rc=0
          python3 "$script" --base "$BASE" || rc=$?
          [ "$rc" = 3 ] || exit "$rc"
          ultimo=$(GH_TOKEN="$GITHUB_TOKEN" gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?check_name=catraca&per_page=100" --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last | if . == null then "nenhum" else .conclusion end') || { echo "espera: a API não leu o check catraca do head; vermelho (falha fechada)"; exit 1; }
          [ "$ultimo" != success ] || { echo "espera: o head já tem catraca verde de outro run; vermelho para o verde velho não valer"; exit 1; }
          echo "espera= (espera rótulo)" >> "$GITHUB_OUTPUT"
      - name: Texto do PR ("Projeto de origem", "Como medir") e código sem teste (T1)
        # Também o script da base (e o bin/forge-check ao lado dele), como o passo de regras: o PR não muda o próprio T1.
        if: ${{ !cancelled() && github.base_ref == 'develop' && github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 "${CATRACA_DA_BASE:-tests/catraca.py}" --modo pr-texto --base "$(git rev-parse HEAD^1)"

  catraca:
    name: catraca${{ needs.conferencia.outputs.espera }}
    # O check exigido. always(): conferência vermelha, cancelada ou pulada reprova este (pulado contaria como verde).
    needs: [conferencia]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Conferência verde
        env:
          CONFERENCIA: ${{ needs.conferencia.result }}
        run: |
          echo "conferência: $CONFERENCIA"
          [ "$CONFERENCIA" = success ]
