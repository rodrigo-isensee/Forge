name: CI

# Pull request: a suíte inteira em 3 partes paralelas por versão de Python (jobs "suíte (python X, parte K/3)", pelo
# scripts/suite-partes.py, o mecanismo do scripts/suite-paralela.py), os demais passos da bateria num job (bateria (passos))
# e um job agregador por versão com o nome do check exigido ("bateria" e "bateria (python 3.14)"), que só passa com todas
# as partes e passos verdes (SUITE-NO-CI, decisão do dono de 2026-11-08: a suíte inteira roda uma vez, no CI). Push na
# develop: só os jobs "rapida" e "rapida-quatorze", que rodam a suíte inteira (scripts/suite-paralela.py, Python 3.12 e
# 3.14, com o mesmo preparo das partes) e são a prova da develop. Promoção (PR develop -> homolog e homolog -> main, push
# na homolog e na main): o job prévio único "árvore" roda scripts/arvore-testada.py (SP4, EST-M7, M2) e as partes pulam a suíte
# só com a prova de verdade: um commit do HEAD com a MESMA árvore (tree-sha) e o job "checagem rápida" daquele commit em success na develop;
# sem prova, erro de rede ou evento fora da lista, a suíte roda inteira. Os passos e os agregadores não mudam. Commit de PR que só muda
# docs/reviews/, docs/qa/, docs/security/, docs/devops/ ou docs/ux/ (fora modelos _* e docs/security/{ameacas,aceites}/),
# com a bateria verde no commit anterior, pula os passos pesados do job de passos (gate por passo, nunca paths-ignore: ele
# deixaria o check exigido pendente); as partes da suíte rodam sempre. A18: as partes esperam o job de passos baratos (lint,
# degrau, validação do plugin, changelog; sem medida do vermelho ainda): passo vermelho pula as partes e o job de verificações
# longas (Provas, shellcheck, e2e), e os agregadores reprovam sem esperar a suíte.
on:
  pull_request:
    types: [opened, synchronize, reopened]  # rótulo e edição do PR reagem só em catraca.yml (sem a bateria pesada)
  push:
    branches: [develop, homolog, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rapida:
    name: checagem rápida (push na develop)
    # Prova do Python 3.12 que o scripts/arvore-testada.py lê (o nome é o JOBS_DE_PROVA dele): mesmo preparo das partes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-26.04
    timeout-minutes: 30  # medido 13-20 min (3.12) e 17-20+ min (3.14, cancelado no teto em 3 runs); 30 dá folga de 50%
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: env com -a (uutils-coreutils do apt; prova viva de 20 formas do lançador)
        run: |
          # uutils-coreutils do apt do runner (universe, sem custo): o env do runner pode recusar `-a`/`--argv0` (era o GNU env 9.4
          # do ubuntu-24.04; o README da imagem 26.04 lista coreutils 9.5-1ubuntu2+0.0.0~ubuntu25, o pacote de transição para o
          # uutils, e o passo abaixo confere o `env --version` e o `-a` de qualquer jeito). Sem `-a` a prova viva do lançador cairia
          # de 20 formas para 2 (CI-ENV-ARGV0). Falha fechado: o passo reprova o job, sem tolerar falha.
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rust-coreutils gnu-coreutils
          alvo=/usr/lib/cargo/bin/coreutils/env
          [ -x "$alvo" ] || { echo "faltou $alvo depois da instalação"; exit 1; }
          mkdir -p "$RUNNER_TEMP/env-argv0"
          ln -sf "$alvo" "$RUNNER_TEMP/env-argv0/env"
          echo "$RUNNER_TEMP/env-argv0" >> "$GITHUB_PATH"
          # conferência no caminho que tests/apoio_volta_unica.py (envs_da_maquina, shutil.which) acha
          export PATH="$RUNNER_TEMP/env-argv0:$PATH"
          achado=$(python3 -c 'import shutil; print(shutil.which("env"))')
          [ "$achado" = "$RUNNER_TEMP/env-argv0/env" ] || { echo "o env do PATH é $achado, não o do uutils"; exit 1; }
          env -a x true || { echo "o env $achado não aceita -a"; exit 1; }
          env X=1 printf '%s' ok | grep -qx ok || { echo "o env $achado não roda env X=1 printf"; exit 1; }
          # gnuenv do gnu-coreutils (o GNU com prefixo): o env_gnu de tests/apoio_volta_unica.py exige toda grafia do
          # --split-string, e o uutils 0.10.0 do 26.04 recusa as abreviaturas (--split, --spl=, --s). Falha fechado.
          gnu=$(command -v gnuenv) || { echo "faltou gnuenv depois da instalação"; exit 1; }
          [ "$("$gnu" --s 'echo a  b')" = "a b" ] || { echo "o $gnu não divide --s como o GNU"; exit 1; }
          env --version | head -1
      - name: Testes do Forge
        run: python3 scripts/suite-paralela.py

  rapida-quatorze:
    name: checagem rápida (push na develop, python 3.14)
    # Prova do Python 3.14 (SP4): sem ela, as partes do 3.14 rodariam em toda promoção.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: env com -a (uutils-coreutils do apt; prova viva de 20 formas do lançador)
        run: |
          # uutils-coreutils do apt do runner (universe, sem custo): o env do runner pode recusar `-a`/`--argv0` (era o GNU env 9.4
          # do ubuntu-24.04; o README da imagem 26.04 lista coreutils 9.5-1ubuntu2+0.0.0~ubuntu25, o pacote de transição para o
          # uutils, e o passo abaixo confere o `env --version` e o `-a` de qualquer jeito). Sem `-a` a prova viva do lançador cairia
          # de 20 formas para 2 (CI-ENV-ARGV0). Falha fechado: o passo reprova o job, sem tolerar falha.
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rust-coreutils gnu-coreutils
          alvo=/usr/lib/cargo/bin/coreutils/env
          [ -x "$alvo" ] || { echo "faltou $alvo depois da instalação"; exit 1; }
          mkdir -p "$RUNNER_TEMP/env-argv0"
          ln -sf "$alvo" "$RUNNER_TEMP/env-argv0/env"
          echo "$RUNNER_TEMP/env-argv0" >> "$GITHUB_PATH"
          # conferência no caminho que tests/apoio_volta_unica.py (envs_da_maquina, shutil.which) acha
          export PATH="$RUNNER_TEMP/env-argv0:$PATH"
          achado=$(python3 -c 'import shutil; print(shutil.which("env"))')
          [ "$achado" = "$RUNNER_TEMP/env-argv0/env" ] || { echo "o env do PATH é $achado, não o do uutils"; exit 1; }
          env -a x true || { echo "o env $achado não aceita -a"; exit 1; }
          env X=1 printf '%s' ok | grep -qx ok || { echo "o env $achado não roda env X=1 printf"; exit 1; }
          # gnuenv do gnu-coreutils (o GNU com prefixo): o env_gnu de tests/apoio_volta_unica.py exige toda grafia do
          # --split-string, e o uutils 0.10.0 do 26.04 recusa as abreviaturas (--split, --spl=, --s). Falha fechado.
          gnu=$(command -v gnuenv) || { echo "faltou gnuenv depois da instalação"; exit 1; }
          [ "$("$gnu" --s 'echo a  b')" = "a b" ] || { echo "o $gnu não divide --s como o GNU"; exit 1; }
          env --version | head -1
      - name: Testes do Forge
        run: python3 scripts/suite-paralela.py

  cobertura:
    name: cobertura (informativa)
    # Piso de cobertura informativo (0.45.1): mede e publica o número no resumo do job, sem reprovar. Só no push na main
    # (uma medida por versão; o ci-local o pula por não se aplicar ao PR). O coletor (scripts/cobertura.py, sys.monitoring)
    # entra como sitecustomize.py do Python do job, para valer também nos processos filhos, inclusive com `python -I`.
    # Nenhum passo reprova (cada comando que pode falhar termina em `|| echo`), e nenhum job depende deste.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Suíte com o coletor de cobertura
        run: |
          site=$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          python3 scripts/cobertura.py instalar "$site" "$RUNNER_TEMP/cobertura" || echo "coletor não instalado: o número sai zero"
          python3 scripts/suite-paralela.py || echo "suíte vermelha sob o coletor: o número sai assim mesmo (o check é a bateria)"
          python3 scripts/cobertura.py remover "$site" || echo "coletor não removido"
      - name: Publica a cobertura (não reprova)
        if: ${{ !cancelled() }}
        run: python3 scripts/cobertura.py relatorio "$RUNNER_TEMP/cobertura" || echo "relatório não saiu"

  arvore:
    name: árvore já provada na develop
    # SP4 e M2 do review da 0.43.3: um job só, antes das partes. Com o passo em cada perna da matriz, o `outputs` do job ficava
    # com a última perna; uma perna sem prova e as outras com prova davam o pulados-* vermelho falso. rc 0 só com a prova
    # completa dos dois Pythons (mesma tree-sha e os dois jobs de prova verdes na develop); sem as duas, as 6 partes rodam a suíte.
    if: github.event_name != 'push' || github.ref != 'refs/heads/develop'
    permissions:
      contents: read
      actions: read  # lê as execuções e os jobs da develop (SP4)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      provada: ${{ steps.arvore.outputs.provada }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Árvore já provada na develop (SP4; sem prova, a suíte roda inteira)
        # o token só neste passo, nunca no da suíte.
        id: arvore
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENTO: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REF: ${{ github.ref }}
        run: |
          provada=false
          if python3 scripts/arvore-testada.py --python 3.12 && python3 scripts/arvore-testada.py --python 3.14; then provada=true; fi
          echo "provada=$provada" >> "$GITHUB_OUTPUT"
          echo "árvore provada na develop (3.12 e 3.14): $provada" >> "$GITHUB_STEP_SUMMARY"

  partes-doze:
    name: suíte (python 3.12, parte ${{ matrix.parte }}/3)
    # Um terço da suíte inteira por job (LPT sobre tests/pesos-d4.json; a mesma árvore dá a mesma divisão nos três). O
    # agregador "bateria" exige os três verdes; cada parte confere que a divisão cobre todo o discover.
    if: github.event_name != 'push' || github.ref != 'refs/heads/develop'
    # M2: a prova vem de um job só (arvore), lida igual pelas 3 partes; A18: e só rodam com os passos baratos verdes (job bateria)
    needs: [arvore, bateria]
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: env com -a (uutils-coreutils do apt; prova viva de 20 formas do lançador)
        if: needs.arvore.outputs.provada != 'true'
        run: |
          # uutils-coreutils do apt do runner (universe, sem custo): o env do runner pode recusar `-a`/`--argv0` (era o GNU env 9.4
          # do ubuntu-24.04; o README da imagem 26.04 lista coreutils 9.5-1ubuntu2+0.0.0~ubuntu25, o pacote de transição para o
          # uutils, e o passo abaixo confere o `env --version` e o `-a` de qualquer jeito). Sem `-a` a prova viva do lançador cairia
          # de 20 formas para 2 (CI-ENV-ARGV0). Falha fechado: o passo reprova o job, sem tolerar falha.
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rust-coreutils gnu-coreutils
          alvo=/usr/lib/cargo/bin/coreutils/env
          [ -x "$alvo" ] || { echo "faltou $alvo depois da instalação"; exit 1; }
          mkdir -p "$RUNNER_TEMP/env-argv0"
          ln -sf "$alvo" "$RUNNER_TEMP/env-argv0/env"
          echo "$RUNNER_TEMP/env-argv0" >> "$GITHUB_PATH"
          # conferência no caminho que tests/apoio_volta_unica.py (envs_da_maquina, shutil.which) acha
          export PATH="$RUNNER_TEMP/env-argv0:$PATH"
          achado=$(python3 -c 'import shutil; print(shutil.which("env"))')
          [ "$achado" = "$RUNNER_TEMP/env-argv0/env" ] || { echo "o env do PATH é $achado, não o do uutils"; exit 1; }
          env -a x true || { echo "o env $achado não aceita -a"; exit 1; }
          env X=1 printf '%s' ok | grep -qx ok || { echo "o env $achado não roda env X=1 printf"; exit 1; }
          # gnuenv do gnu-coreutils (o GNU com prefixo): o env_gnu de tests/apoio_volta_unica.py exige toda grafia do
          # --split-string, e o uutils 0.10.0 do 26.04 recusa as abreviaturas (--split, --spl=, --s). Falha fechado.
          gnu=$(command -v gnuenv) || { echo "faltou gnuenv depois da instalação"; exit 1; }
          [ "$("$gnu" --s 'echo a  b')" = "a b" ] || { echo "o $gnu não divide --s como o GNU"; exit 1; }
          env --version | head -1
      - name: Testes do Forge (parte)
        if: needs.arvore.outputs.provada != 'true'
        env:
          PARTE: ${{ matrix.parte }}
        run: |
          python3 --version
          FORGE_SUITE_PULADOS="$RUNNER_TEMP/pulados/parte-$PARTE.json" python3 scripts/suite-partes.py --parte "$PARTE/3"
      - name: Pulados da parte para o agregador (T3)
        if: needs.arvore.outputs.provada != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulados-doze-${{ matrix.parte }}
          path: ${{ runner.temp }}/pulados/parte-${{ matrix.parte }}.json
          if-no-files-found: error
          retention-days: 1

  partes-quatorze:
    name: suíte (python 3.14, parte ${{ matrix.parte }}/3)
    # Um terço da suíte inteira por job (LPT sobre tests/pesos-d4.json; a mesma árvore dá a mesma divisão nos três). O
    # agregador "bateria (python 3.14)" exige os três verdes; cada parte confere que a divisão cobre todo o discover.
    if: github.event_name != 'push' || github.ref != 'refs/heads/develop'
    # M2: a prova vem de um job só (arvore), lida igual pelas 3 partes; A18: e só rodam com os passos baratos verdes (job bateria)
    needs: [arvore, bateria]
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: env com -a (uutils-coreutils do apt; prova viva de 20 formas do lançador)
        if: needs.arvore.outputs.provada != 'true'
        run: |
          # uutils-coreutils do apt do runner (universe, sem custo): o env do runner pode recusar `-a`/`--argv0` (era o GNU env 9.4
          # do ubuntu-24.04; o README da imagem 26.04 lista coreutils 9.5-1ubuntu2+0.0.0~ubuntu25, o pacote de transição para o
          # uutils, e o passo abaixo confere o `env --version` e o `-a` de qualquer jeito). Sem `-a` a prova viva do lançador cairia
          # de 20 formas para 2 (CI-ENV-ARGV0). Falha fechado: o passo reprova o job, sem tolerar falha.
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rust-coreutils gnu-coreutils
          alvo=/usr/lib/cargo/bin/coreutils/env
          [ -x "$alvo" ] || { echo "faltou $alvo depois da instalação"; exit 1; }
          mkdir -p "$RUNNER_TEMP/env-argv0"
          ln -sf "$alvo" "$RUNNER_TEMP/env-argv0/env"
          echo "$RUNNER_TEMP/env-argv0" >> "$GITHUB_PATH"
          # conferência no caminho que tests/apoio_volta_unica.py (envs_da_maquina, shutil.which) acha
          export PATH="$RUNNER_TEMP/env-argv0:$PATH"
          achado=$(python3 -c 'import shutil; print(shutil.which("env"))')
          [ "$achado" = "$RUNNER_TEMP/env-argv0/env" ] || { echo "o env do PATH é $achado, não o do uutils"; exit 1; }
          env -a x true || { echo "o env $achado não aceita -a"; exit 1; }
          env X=1 printf '%s' ok | grep -qx ok || { echo "o env $achado não roda env X=1 printf"; exit 1; }
          # gnuenv do gnu-coreutils (o GNU com prefixo): o env_gnu de tests/apoio_volta_unica.py exige toda grafia do
          # --split-string, e o uutils 0.10.0 do 26.04 recusa as abreviaturas (--split, --spl=, --s). Falha fechado.
          gnu=$(command -v gnuenv) || { echo "faltou gnuenv depois da instalação"; exit 1; }
          [ "$("$gnu" --s 'echo a  b')" = "a b" ] || { echo "o $gnu não divide --s como o GNU"; exit 1; }
          env --version | head -1
      - name: Testes do Forge (parte)
        if: needs.arvore.outputs.provada != 'true'
        env:
          PARTE: ${{ matrix.parte }}
        run: |
          python3 --version
          FORGE_SUITE_PULADOS="$RUNNER_TEMP/pulados/parte-$PARTE.json" python3 scripts/suite-partes.py --parte "$PARTE/3"
      - name: Pulados da parte para o agregador (T3)
        if: needs.arvore.outputs.provada != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulados-quatorze-${{ matrix.parte }}
          path: ${{ runner.temp }}/pulados/parte-${{ matrix.parte }}.json
          if-no-files-found: error
          retention-days: 1

  instalacao-quatorze:
    name: instalação (python 3.14)
    # O e2e de instalação no Python 3.14 (python3 -c e bin/forge-init), ao lado das partes da suíte (CI-PY314).
    if: github.event_name != 'push' || github.ref != 'refs/heads/develop'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Claude Code CLI (nova tentativa só na instalação, por falha de rede; confere a versão)
        run: |
          instalar() { npm install -g --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code@2.1.296; }
          instalar || { echo "instalação falhou (rede); uma segunda tentativa"; sleep 5; instalar; }
          claude --version
      - name: Instala o Forge num projeto vazio e inicializa (Python 3.14)
        run: bash tests/e2e-instalacao.sh

  pulados-doze:
    name: teto de pulados (python 3.12)
    # T3: a soma dos pulados das 3 partes (cada parte verde publica os dela) contra teto_pulados de tests/config.json,
    # fora do agregador, que não roda código da branch.
    needs: [partes-doze, arvore]
    # SP4: com a árvore provada na develop as partes não rodam a suíte nem publicam pulados; o teto já valeu lá (suite-paralela),
    # e o job passa sem somar (pulado, o agregador o reprovaria).
    if: github.event_name != 'push' || github.ref != 'refs/heads/develop'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Pulados das 3 partes (T3)
        if: needs.arvore.outputs.provada != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pulados-doze-*
          merge-multiple: true
          path: ${{ runner.temp }}/pulados
      - name: Teto de pulados na soma das partes (T3)
        if: needs.arvore.outputs.provada != 'true'
        run: python3 scripts/suite-partes.py --somar-pulados 3 "$RUNNER_TEMP/pulados"

  pulados-quatorze:
    name: teto de pulados (python 3.14)
    # T3: a soma dos pulados das 3 partes (cada parte verde publica os dela) contra teto_pulados de tests/config.json,
    # fora do agregador, que não roda código da branch.
    needs: [partes-quatorze, arvore]
    # SP4: com a árvore provada na develop as partes não rodam a suíte nem publicam pulados; o teto já valeu lá (suite-paralela),
    # e o job passa sem somar (pulado, o agregador o reprovaria).
    if: github.event_name != 'push' || github.ref != 'refs/heads/develop'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Pulados das 3 partes (T3)
        if: needs.arvore.outputs.provada != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pulados-quatorze-*
          merge-multiple: true
          path: ${{ runner.temp }}/pulados
      - name: Teto de pulados na soma das partes (T3)
        if: needs.arvore.outputs.provada != 'true'
        run: python3 scripts/suite-partes.py --somar-pulados 3 "$RUNNER_TEMP/pulados"

  bateria-python-tres-quatorze:
    name: bateria (python 3.14)
    # Agregador do check exigido: só passa com as 3 partes, o teto de pulados e a instalação no 3.14 em success.
    # always(): falha, cancelamento
    # ou pulo de um job necessário reprova este (um job pulado contaria como verde para a regra de proteção).
    needs: [partes-quatorze, pulados-quatorze, instalacao-quatorze]
    if: always() && (github.event_name != 'push' || github.ref != 'refs/heads/develop')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Partes e instalação verdes
        env:
          PARTES: ${{ needs.partes-quatorze.result }}
          PULADOS: ${{ needs.pulados-quatorze.result }}
          INSTALACAO: ${{ needs.instalacao-quatorze.result }}
        run: |
          echo "partes: $PARTES; pulados: $PULADOS; instalação: $INSTALACAO"
          [ "$PARTES" = success ] && [ "$PULADOS" = success ] && [ "$INSTALACAO" = success ]

  bateria:
    name: bateria (passos)
    # Só os passos baratos (gate, lint, degrau, CLI, validate, changelog, segredo): as partes, o job de verificações
    # longas e o agregador "bateria" esperam este job (A18), de modo que um vermelho aqui pula o resto.
    if: github.event_name != 'push' || github.ref != 'refs/heads/develop'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read  # o gate lê o resultado da bateria no commit anterior do PR
    outputs:
      pesada: ${{ steps.gate.outputs.pesada }}
    env:
      ACTIONLINT_VERSAO: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSAO: "1.30.1"
      ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # CI-ATALHO-COMMIT-SO-PARECER (v047 E1.75, A2 do review da E1.4): o gate lê o check "bateria" (o agregador), não os jobs da
      # suíte, e fica assim de propósito. Custo do caso que o A2 aponta: com o parecer faltando o agregador está vermelho no commit
      # anterior, então o commit que traz o parecer roda a suíte uma vez a mais (minutos, nunca um merge indevido: o agregador do
      # commit novo ainda exige o job de pareceres e a suíte verde). Ler os jobs da suíte pediria confiar em partes "skipped" de
      # commits só de parecer encadeados (indistinguíveis de um pulo por falha) e atrelar o gate aos nomes da matriz; o agregador é
      # o único check que já reúne os dois e falha fechado. O gate tem o hash do `run` fixado em tests/test_ci_local.py.
      - name: Gate (commit só de parecer, com a bateria verde no commit anterior, pula os passos pesados)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          ACAO: ${{ github.event.action }}
          ANTES: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          pesada=true
          # Só PR com base develop; a promoção para a homolog roda a bateria completa (R-FLUXO).
          if [ "$EVENTO" = pull_request ] && [ "$BASE_REF" = develop ] && [ "$ACAO" = synchronize ] && [ -n "$ANTES" ] && git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            mudados=$(git diff --name-only --no-renames "$ANTES" "$HEAD_SHA" 2>/dev/null || echo "?")
            # Modelo (nome começando em "_") e docs/security/{ameacas,aceites}/ não são parecer: rodam tudo, como no pre-push.
            if [ -n "$mudados" ] && ! printf '%s\n' "$mudados" | grep -qvE '^docs/(reviews|qa|security|devops|ux)/' \
              && ! printf '%s\n' "$mudados" | grep -qE '/_[^/]*$|^docs/security/(ameacas|aceites)/'; then
              # Só o check mais recente "bateria" do app github-actions conta, e precisa ser success.
              verdes=$(gh api "repos/$REPO/commits/$ANTES/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "bateria" and .app.slug == "github-actions")] | sort_by(.started_at) | last | if . != null and .conclusion == "success" then 1 else 0 end' 2>/dev/null || echo 0)
              if [ "$verdes" -gt 0 ]; then
                pesada=false
              fi
            fi
          fi
          echo "pesada=$pesada" >> "$GITHUB_OUTPUT"
          echo "passos pesados: $pesada" >> "$GITHUB_STEP_SUMMARY"
      - name: Testes que leem pareceres (commit só de parecer)
        if: ${{ !cancelled() && steps.gate.outputs.pesada != 'true' }}
        run: python3 -m unittest tests.test_forge.Neutralidade tests.test_forge.Referencias tests.test_forge.AntiDuplicacao tests.test_forge.NeutralidadeDoNucleo -v
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.gate.outputs.pesada == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ !cancelled() && steps.gate.outputs.pesada == 'true' }}
        with:
          node-version: "24"
      # CI-ORDEM-LINT: ferramentas e lint antes de qualquer passo que execute código da branch (ele não pode pôr binário no GITHUB_PATH).
      - name: Baixa actionlint e zizmor em versão fixa e confere o checksum
        if: ${{ !cancelled() && steps.gate.outputs.pesada == 'true' }}
        run: |
          set -euo pipefail
          ferramentas="$RUNNER_TEMP/ferramentas"
          mkdir -p "$ferramentas"
          base_a="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSAO}"
          base_z="https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSAO}"
          curl -fsSL -o "$ferramentas/actionlint.tgz" "$base_a/actionlint_${ACTIONLINT_VERSAO}_linux_amd64.tar.gz"
          curl -fsSL -o "$ferramentas/zizmor.tgz" "$base_z/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ACTIONLINT_SHA256  $ferramentas/actionlint.tgz" | sha256sum -c -
          echo "$ZIZMOR_SHA256  $ferramentas/zizmor.tgz" | sha256sum -c -
          tar -xzf "$ferramentas/actionlint.tgz" -C "$ferramentas" actionlint
          tar -xzf "$ferramentas/zizmor.tgz" -C "$ferramentas" zizmor
          echo "$ferramentas" >> "$GITHUB_PATH"
      - name: actionlint
        if: ${{ !cancelled() && steps.gate.outputs.pesada == 'true' }}
        run: actionlint -color
      - name: zizmor (offline, sem token; falha em severidade média ou maior)
        if: ${{ !cancelled() && steps.gate.outputs.pesada == 'true' }}
        run: zizmor --offline --no-progress --min-severity medium .github/workflows
      # A18: os passos baratos (degrau, validação do plugin, changelog) logo depois do lint, e as partes da suíte e o job de
      # verificações longas esperam este job (needs).
      # A Neutralidade roda uma vez só, nas partes (tests.test_forge). O CLI e o validate seguem antes de todo código da branch
      # (bin/forge-changelog, tests/), que poderia pôr um `claude` falso no GITHUB_PATH (a razão do CI-ORDEM-LINT).
      - name: Nada pula degrau
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$BASE" in
            homolog) [ "$HEAD_REF" = "develop" ] || { echo "PR para homolog só a partir da develop (veio de $HEAD_REF)."; exit 1; } ;;
            main)    [ "$HEAD_REF" = "homolog" ] || { echo "PR para main só a partir da homolog (veio de $HEAD_REF)."; exit 1; } ;;
          esac
          echo "ok: $HEAD_REF -> $BASE"
      - name: Claude Code CLI (nova tentativa só na instalação, por falha de rede; confere a versão)
        if: ${{ !cancelled() && steps.gate.outputs.pesada == 'true' }}
        run: |
          instalar() { npm install -g --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code@2.1.296; }
          instalar || { echo "instalação falhou (rede); uma segunda tentativa"; sleep 5; instalar; }
          claude --version
      - name: claude plugin validate --strict
        if: ${{ !cancelled() && steps.gate.outputs.pesada == 'true' }}
        run: claude plugin validate . --strict
      - name: develop - mudança na fábrica exige fragmento em changelog.d
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'develop' }}
        # A base é o primeiro pai do merge commit do checkout (a ponta atual da develop), não o SHA do evento, que fica velho
        # quando a develop anda e acusa fragmento de outro PR (CI-CHANGELOG-BASE); a catraca e o passo de pareceres fazem igual.
        run: |
          BASE=$(git rev-parse HEAD^1)
          python3 bin/forge-changelog conferir --base "$BASE"
      - name: release exige versão nova e changelog fechado (main sempre; homolog só se a versão subiu)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'homolog') }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" = homolog ]; then
            python3 scripts/conferir-release.py --base "$BASE" --so-se-versao-mudou
          else
            python3 scripts/conferir-release.py --base "$BASE"
          fi
      - name: Segredo, .env ou caminho pessoal no diff
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        # A base é o primeiro pai do merge commit do checkout (a ponta atual da base), não o SHA do evento.
        run: |
          BASE=$(git rev-parse HEAD^1)
          if scripts/verificar-contribuicao.sh "$BASE"; then
            echo "segredos: sem achados" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "segredos: achados no diff (arquivo e linha no log; o valor nunca é impresso)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  pareceres:
    name: bateria (pareceres)
    # CI-PARECER-NAO-BARRA-SUITE (v047 E1.4): a checagem de pareceres é job próprio. Parecer faltando reprova este job e, pelo
    # agregador "bateria" (que o tem em needs), o merge; mas ele não está em needs das partes nem do job de verificações, então a
    # suíte roda inteira mesmo assim e o autor vê o vermelho dos testes junto com o do parecer, numa rodada só.
    # Só PR (nas promoções o script não lê parecer, ADR 0008, seção 3); sem token (só contents: read).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Parecer de review (e de QA para a homolog) quando o PR toca código que governa os agentes
        # Roda o script da base (a introdução usa o do PR); promoções ficam fora do job (ADR 0008, seção 3).
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          PR_AUTOR: ${{ github.event.pull_request.user.login }}
        run: |
          BASE=$(git rev-parse HEAD^1)
          script=tests/catraca.py
          if git cat-file -e "$BASE:tests/catraca.py" 2>/dev/null; then
            git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
            script="$RUNNER_TEMP/base/tests/catraca.py"
          fi
          python3 "$script" --modo pareceres --base "$BASE" --head "$HEAD_SHA" --ramo="$HEAD_REF" --base-ref "$BASE_REF"

  verificacoes:
    name: bateria (verificações longas)
    # A18: Provas, shellcheck e e2e de instalação esperam o job de passos baratos (needs): um vermelho barato pula este job, as
    # partes e os agregadores. Roda em paralelo às partes da suíte. O gate (pesada) vem do job de passos, que o calcula;
    # `!= 'false'` (e não `== 'true'`) para o ci-local, que não leva a saída de job entre jobs, rodar os passos.
    needs: [bateria]
    if: github.event_name != 'push' || github.ref != 'refs/heads/develop'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.bateria.outputs.pesada != 'false'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ !cancelled() && needs.bateria.outputs.pesada != 'false' }}
        with:
          node-version: "24"
      # O CLI antes de qualquer código da branch (a razão do CI-ORDEM-LINT): ele não pode pôr um `claude` falso no GITHUB_PATH.
      - name: Claude Code CLI (nova tentativa só na instalação, por falha de rede; confere a versão)
        if: ${{ !cancelled() && needs.bateria.outputs.pesada != 'false' }}
        run: |
          instalar() { npm install -g --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code@2.1.296; }
          instalar || { echo "instalação falhou (rede); uma segunda tentativa"; sleep 5; instalar; }
          claude --version
      - name: Provas cmd do arquivo de provas, reexecutadas no sha do PR (R-PROVA)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'develop' }}
        # Roda o script da base (a introdução usa o do PR) sobre docs/provas/*.md da branch, numa cópia limpa do sha do PR.
        # Só em PR para a develop: as promoções (develop -> homolog, homolog -> main) reexecutariam provas de outros PRs num sha que não é o delas.
        # Sem shell, só comando da lista permitida do script, sem segredo no ambiente do comando; sem arquivo, nada a fazer.
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE=$(git rev-parse HEAD^1)
          script=scripts/reexecutar-provas.py
          if git cat-file -e "$BASE:scripts/reexecutar-provas.py" 2>/dev/null; then
            [ -d "$RUNNER_TEMP/base" ] || git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
            script="$RUNNER_TEMP/base/scripts/reexecutar-provas.py"
          fi
          git worktree add --detach "$RUNNER_TEMP/pr" "$HEAD_SHA"
          lista=$(git diff --name-only --no-renames --diff-filter=AM "$BASE...$HEAD_SHA" -- ':(glob)docs/provas/*.md')
          mapfile -t provas < <(printf '%s\n' "$lista" | grep -v -e '^$' -e '/_modelo\.md$' || true)
          if [ "${#provas[@]}" -eq 0 ]; then
            echo "provas cmd: sem arquivo de provas no PR" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 "$script" --raiz "$RUNNER_TEMP/pr" "${provas[@]}"
      - name: shellcheck (scripts e hooks)
        if: ${{ !cancelled() && needs.bateria.outputs.pesada != 'false' }}
        # COBERTURA-P6: os arquivos vêm do shebang (a mesma regra do tipo_de_script do .githooks/pre-push), não de uma lista
        # fixa: script novo em shell entra sozinho. `*.sh`, ou primeira linha `#!` com bash ou sh; link e `*.py` ficam fora.
        run: |
          lista=()
          while IFS= read -r -d '' f; do
            if [ ! -f "$f" ] || [ -L "$f" ]; then continue; fi
            case "$f" in *.py) continue ;; *.sh) lista+=("$f"); continue ;; esac
            IFS= read -r primeira < "$f" || continue
            case "$primeira" in '#!'*python*) ;; '#!'*bash*|'#!'*/sh|'#!'*' sh') lista+=("$f") ;; esac
          done < <(git ls-files -z)
          [ "${#lista[@]}" -ge 10 ] || { echo "shellcheck: só ${#lista[@]} scripts pelo shebang; a busca falhou"; exit 1; }
          echo "shellcheck: ${lista[*]}"
          shellcheck -- "${lista[@]}"
      - name: Instala o Forge num projeto vazio e inicializa
        if: ${{ !cancelled() && needs.bateria.outputs.pesada != 'false' }}
        run: bash tests/e2e-instalacao.sh

  agregador:
    name: bateria
    # Agregador do check exigido: só passa com os passos, as 3 partes da suíte no 3.12 e o teto de pulados em success.
    # always(): falha,
    # cancelamento ou pulo de um job necessário reprova este (um job pulado contaria como verde para a regra de proteção).
    needs: [bateria, pareceres, verificacoes, partes-doze, pulados-doze]
    if: always() && (github.event_name != 'push' || github.ref != 'refs/heads/develop')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Passos e partes verdes
        env:
          PASSOS: ${{ needs.bateria.result }}
          PARECERES: ${{ needs.pareceres.result }}
          VERIFICACOES: ${{ needs.verificacoes.result }}
          PARTES: ${{ needs.partes-doze.result }}
          PULADOS: ${{ needs.pulados-doze.result }}
          EVENTO: ${{ github.event_name }}
        run: |
          echo "passos: $PASSOS; pareceres: $PARECERES; verificações: $VERIFICACOES; partes: $PARTES; pulados: $PULADOS"
          # pareceres: success em PR; skipped nos eventos de push (o job só existe em PR), que não são do agregador de merge
          { [ "$PARECERES" = success ] || { [ "$PARECERES" = skipped ] && [ "$EVENTO" != pull_request ]; }; } && [ "$PASSOS" = success ] && [ "$VERIFICACOES" = success ] && [ "$PARTES" = success ] && [ "$PULADOS" = success ]
