name: CI

# Bateria rápida em todo PR e push nas branches do fluxo (branch -> develop -> homolog -> main).
on:
  pull_request:
  push:
    branches: [develop, homolog, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: testes estruturais
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Testes do Forge
        run: python3 -m unittest discover -s tests -v

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Scripts e hooks
        run: shellcheck bin/forge-init scripts/jarvis scripts/instalar-atalho.sh tests/e2e-instalacao.sh .githooks/pre-push templates/projeto/.githooks/pre-push

  plugin:
    name: validação do plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: claude plugin validate --strict
        run: claude plugin validate . --strict

  instalacao:
    name: instalação de ponta a ponta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Instala o Forge num projeto vazio e inicializa
        run: bash tests/e2e-instalacao.sh

  versao:
    name: versão e changelog
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Mudança na fábrica exige versão nova
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mudou=$(git diff --name-only "$BASE" HEAD -- agents skills templates bin scripts docs .claude-plugin hooks | wc -l)
          atual=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          base=$(git show "$BASE:.claude-plugin/plugin.json" 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin)['version'])" 2>/dev/null || echo "0.0.0")
          echo "arquivos da fábrica alterados: $mudou | versão base: $base | versão do PR: $atual"
          if [ "$mudou" -gt 0 ]; then
            python3 - "$base" "$atual" <<'PY'
          import sys
          b, a = (tuple(map(int, v.split("."))) for v in sys.argv[1:3])
          if a <= b:
              sys.exit(f"Suba a versão em .claude-plugin/plugin.json (base {sys.argv[1]}, PR {sys.argv[2]}) e registre no CHANGELOG.md.")
          PY
          fi

  fluxo:
    name: fluxo de promoção
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Nada pula degrau
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$BASE" in
            homolog) [ "$HEAD_REF" = "develop" ] || { echo "PR para homolog só a partir da develop (veio de $HEAD_REF)."; exit 1; } ;;
            main)    [ "$HEAD_REF" = "homolog" ] || { echo "PR para main só a partir da homolog (veio de $HEAD_REF)."; exit 1; } ;;
          esac
          echo "ok: $HEAD_REF -> $BASE"
