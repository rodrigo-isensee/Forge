name: CI

# Pull request: bateria completa (job "bateria"), em um job só porque o GitHub cobra cada job por minuto cheio (~10 jobs
# de 10 s custavam 10 min). Push na develop: só a checagem rápida (o PR já validou o mesmo conteúdo, R-FLUXO). Push na
# homolog e na main: a bateria completa de novo. Commit de PR que só muda docs/reviews/ ou docs/qa/ pula os passos pesados
# (gate por passo, nunca paths-ignore: ele deixaria o check exigido pendente).
on:
  pull_request:
    types: [opened, synchronize, reopened]  # rótulo e edição do PR reagem só em catraca.yml (sem a bateria pesada)
  push:
    branches: [develop, homolog, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rapida:
    name: checagem rápida (push na develop)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Testes do Forge
        run: python3 -m unittest discover -s tests -v

  bateria:
    name: bateria
    if: github.event_name != 'push' || github.ref != 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read  # o gate lê o resultado da bateria no commit anterior do PR
    env:
      ACTIONLINT_VERSAO: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSAO: "1.30.1"
      ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gate (commit só de parecer, com a bateria verde no commit anterior, pula os passos pesados)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          ACAO: ${{ github.event.action }}
          ANTES: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          pesada=true
          # Só PR com base develop; a promoção para a homolog roda a bateria completa (R-FLUXO).
          if [ "$EVENTO" = pull_request ] && [ "$BASE_REF" = develop ] && [ "$ACAO" = synchronize ] && [ -n "$ANTES" ] && git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            mudados=$(git diff --name-only --no-renames "$ANTES" "$HEAD_SHA" 2>/dev/null || echo "?")
            if [ -n "$mudados" ] && ! printf '%s\n' "$mudados" | grep -qvE '^docs/(reviews|qa)/'; then
              # Só o check mais recente "bateria" do app github-actions conta, e precisa ser success.
              verdes=$(gh api "repos/$REPO/commits/$ANTES/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "bateria" and .app.slug == "github-actions")] | sort_by(.started_at) | last | if . != null and .conclusion == "success" then 1 else 0 end' 2>/dev/null || echo 0)
              if [ "$verdes" -gt 0 ]; then
                pesada=false
              fi
            fi
          fi
          echo "pesada=$pesada" >> "$GITHUB_OUTPUT"
          echo "passos pesados: $pesada" >> "$GITHUB_STEP_SUMMARY"
      - name: Testes que leem pareceres (commit só de parecer)
        if: ${{ !cancelled() && steps.gate.outputs.pesada != 'true' }}
        run: python3 -m unittest tests.test_forge.Neutralidade tests.test_forge.Referencias tests.test_forge.AntiDuplicacao -v
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.gate.outputs.pesada == 'true'
        with:
          python-version: "3.12"
      - name: Testes do Forge
        if: ${{ !cancelled() && steps.gate.outputs.pesada == 'true' }}
        run: python3 -m unittest discover -s tests -v
      - name: shellcheck (scripts e hooks)
        if: ${{ !cancelled() && steps.gate.outputs.pesada == 'true' }}
        run: shellcheck bin/forge-init scripts/jarvis scripts/jarvis-forge scripts/preparar-estacao.sh scripts/instalar-atalho.sh scripts/verificar-contribuicao.sh scripts/validar-plugin.sh scripts/configurar-ambiente-local.sh tests/e2e-instalacao.sh .githooks/pre-push templates/projeto/.githooks/pre-push
      - name: Baixa actionlint e zizmor em versão fixa e confere o checksum
        if: ${{ !cancelled() && steps.gate.outputs.pesada == 'true' }}
        run: |
          set -euo pipefail
          ferramentas="$RUNNER_TEMP/ferramentas"
          mkdir -p "$ferramentas"
          base_a="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSAO}"
          base_z="https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSAO}"
          curl -fsSL -o "$ferramentas/actionlint.tgz" "$base_a/actionlint_${ACTIONLINT_VERSAO}_linux_amd64.tar.gz"
          curl -fsSL -o "$ferramentas/zizmor.tgz" "$base_z/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ACTIONLINT_SHA256  $ferramentas/actionlint.tgz" | sha256sum -c -
          echo "$ZIZMOR_SHA256  $ferramentas/zizmor.tgz" | sha256sum -c -
          tar -xzf "$ferramentas/actionlint.tgz" -C "$ferramentas" actionlint
          tar -xzf "$ferramentas/zizmor.tgz" -C "$ferramentas" zizmor
          echo "$ferramentas" >> "$GITHUB_PATH"
      - name: actionlint
        if: ${{ !cancelled() && steps.gate.outputs.pesada == 'true' }}
        run: actionlint -color
      - name: zizmor (offline, sem token; falha em severidade média ou maior)
        if: ${{ !cancelled() && steps.gate.outputs.pesada == 'true' }}
        run: zizmor --offline --no-progress --min-severity medium .github/workflows
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ !cancelled() && steps.gate.outputs.pesada == 'true' }}
        with:
          node-version: "24"
      - name: Claude Code CLI
        if: ${{ !cancelled() && steps.gate.outputs.pesada == 'true' }}
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: claude plugin validate --strict
        if: ${{ !cancelled() && steps.gate.outputs.pesada == 'true' }}
        run: claude plugin validate . --strict
      - name: Instala o Forge num projeto vazio e inicializa
        if: ${{ !cancelled() && steps.gate.outputs.pesada == 'true' }}
        run: bash tests/e2e-instalacao.sh
      - name: develop - mudança na fábrica exige linha nova em [Não publicado]
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'develop' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mudou=$(git diff --name-only "$BASE" HEAD -- agents skills templates bin scripts docs .claude-plugin hooks | wc -l)
          atual=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          base=$(git show "$BASE:.claude-plugin/plugin.json" 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin)['version'])" 2>/dev/null || echo "$atual")
          echo "arquivos da fábrica alterados: $mudou | versão base: $base | versão do PR: $atual"
          if [ "$atual" != "$base" ]; then
            echo "PR de release (versão mudou): a conversão de [Não publicado] é conferida na promoção para a main."
          elif [ "$mudou" -gt 0 ]; then
            git show "$BASE:CHANGELOG.md" > /tmp/changelog-base.md 2>/dev/null || : > /tmp/changelog-base.md
            python3 - /tmp/changelog-base.md CHANGELOG.md <<'PY'
          import re, sys

          def nao_publicado(caminho):
              texto = open(caminho, encoding="utf-8").read()
              m = re.search(r"^## \[Não publicado\][^\n]*\n(.*?)(?=^## |\Z)", texto, re.M | re.S)
              return [l.strip() for l in (m.group(1) if m else "").splitlines() if l.strip().startswith("-")]

          novas = set(nao_publicado(sys.argv[2])) - set(nao_publicado(sys.argv[1]))
          if not novas:
              sys.exit("Acrescente ao menos uma linha em '## [Não publicado]' do CHANGELOG.md (não suba a versão no PR).")
          print(f"ok: {len(novas)} linha(s) nova(s) em [Não publicado]")
          PY
          fi
      - name: main - release exige versão nova e changelog fechado
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'main' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          atual=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          base=$(git show "$BASE:.claude-plugin/plugin.json" 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin)['version'])" 2>/dev/null || echo "0.0.0")
          echo "versão base: $base | versão da release: $atual"
          python3 - "$base" "$atual" CHANGELOG.md <<'PY'
          import re, sys

          b, a = (tuple(map(int, v.split("."))) for v in sys.argv[1:3])
          if a <= b:
              sys.exit(f"Suba a versão em .claude-plugin/plugin.json (base {sys.argv[1]}, release {sys.argv[2]}).")
          texto = open(sys.argv[3], encoding="utf-8").read()
          if not re.search(rf"^## \[{re.escape(sys.argv[2])}\]", texto, re.M):
              sys.exit(f"CHANGELOG.md sem a entrada '## [{sys.argv[2]}]'.")
          m = re.search(r"^## \[Não publicado\][^\n]*\n(.*?)(?=^## |\Z)", texto, re.M | re.S)
          if m and any(l.strip() for l in m.group(1).splitlines()):
              sys.exit("Converta '## [Não publicado]' em '## [" + sys.argv[2] + "] - data': a seção deve estar vazia na release.")
          PY
      - name: Nada pula degrau
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$BASE" in
            homolog) [ "$HEAD_REF" = "develop" ] || { echo "PR para homolog só a partir da develop (veio de $HEAD_REF)."; exit 1; } ;;
            main)    [ "$HEAD_REF" = "homolog" ] || { echo "PR para main só a partir da homolog (veio de $HEAD_REF)."; exit 1; } ;;
          esac
          echo "ok: $HEAD_REF -> $BASE"
      - name: Segredo, .env ou caminho pessoal no diff
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        # A base é o primeiro pai do merge commit do checkout (a ponta atual da base), não o SHA do evento.
        run: |
          BASE=$(git rev-parse HEAD^1)
          if scripts/verificar-contribuicao.sh "$BASE"; then
            echo "segredos: sem achados" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "segredos: achados no diff (arquivo e linha no log; o valor nunca é impresso)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Parecer de review (e de QA para a homolog) quando o PR toca código que governa os agentes
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        # Roda o script da base (a introdução usa o do PR); promoções ficam fora do job (ADR 0008, seção 3).
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_AUTOR: ${{ github.event.pull_request.user.login }}
        run: |
          BASE=$(git rev-parse HEAD^1)
          script=tests/catraca.py
          if git cat-file -e "$BASE:tests/catraca.py" 2>/dev/null; then
            git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
            script="$RUNNER_TEMP/base/tests/catraca.py"
          fi
          python3 "$script" --modo pareceres --base "$BASE" --head "$HEAD_SHA" --ramo="$HEAD_REF" --base-ref "$BASE_REF"
