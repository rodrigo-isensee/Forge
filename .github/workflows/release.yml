name: Release

# Depois que o usuário mescla um PR na main: se a versão do plugin.json ainda não tem tag,
# cria a tag vX.Y.Z e a release com as notas daquela versão no CHANGELOG.md. A suíte não roda de novo quando a árvore
# da main é a mesma que já passou na develop (SP4: scripts/arvore-testada.py; sem prova, roda inteira).
on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read  # o passo da árvore lê as execuções e os jobs da develop (SP4)

jobs:
  release:
    runs-on: ubuntu-26.04
    # 25 min: a suíte em série estourou 20 min na v0.32.0 (run 41748756935); agora roda em paralelo, como o CI
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false  # o token só serve ao `gh release`, não aos testes
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Árvore já provada na develop (SP4; sem prova, a suíte roda inteira)
        # rc 0 só com a prova completa (mesma tree-sha e o job de prova verde); o token só neste passo, nunca no da suíte.
        id: arvore
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENTO: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REF: ${{ github.ref }}
        run: |
          if python3 scripts/arvore-testada.py; then provada=true; else provada=false; fi
          echo "provada=$provada" >> "$GITHUB_OUTPUT"
          echo "árvore provada na develop: $provada" >> "$GITHUB_STEP_SUMMARY"
      - name: Testes antes de publicar
        if: steps.arvore.outputs.provada != 'true'
        run: python3 scripts/suite-paralela.py
      - name: Tag e release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versao=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          tag="v$versao"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag já existe; nada a publicar."; exit 0
          fi
          awk -v v="$versao" '
            $0 ~ "^## \\[" v "\\]" {dentro=1; next}
            dentro && /^## \[/ {exit}
            dentro {print}
          ' CHANGELOG.md > notas.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "Forge $tag" --notes-file notas.md
