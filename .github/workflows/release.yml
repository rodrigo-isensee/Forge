name: Release

# Depois que o usuário mescla um PR na main: se a versão do plugin.json ainda não tem tag,
# cria a tag vX.Y.Z e a release com as notas daquela versão no CHANGELOG.md.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Testes antes de publicar
        run: python3 -m unittest discover -s tests -q
      - name: Tag e release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versao=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          tag="v$versao"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag já existe; nada a publicar."; exit 0
          fi
          awk -v v="$versao" '
            $0 ~ "^## \\[" v "\\]" {dentro=1; next}
            dentro && /^## \[/ {exit}
            dentro {print}
          ' CHANGELOG.md > notas.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "Forge $tag" --notes-file notas.md
